<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marketplace DApp</title>

    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    
    <!-- Toastr CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">

    <style>
        .panel-proposal {
            border: 2px solid #dee2e6;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .panel-proposal:hover {
            border-color: #007bff;
            box-shadow: 0 4px 8px rgba(0,123,255,0.2);
        }
        
        .proposal-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .vote-count {
            font-size: 1.2em;
            color: #28a745;
            font-weight: bold;
        }
        
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4 mt-4">Buy & Sell Your Items</h1>
                <hr/>
            </div>
        </div>

        <!-- Proposals Row -->
        <div class="row">
            <!-- Proposal 0: Sell -->
            <div class="col-lg-3 col-md-6 col-sm-12">
                <div class="sell-container">
                    <div class="card-header text-center">
                        <h2 class="card-title mb-0">Sell Your Items</h2>
                        <form id="sellForm" onsubmit="addItem(); return false;">
                            <label for="itemname">Item Name:</label>
                            <input type="text" id="itemName" name="itemName" placeholder="Enter Item Name" required>
                            <label> Price (ETH):</label>
                            <input type="number" id="itemPrice" placeholder="Enter Price" required>
                            <button type="Submit">Sell</button>
                        </form>
                    </div>
                    

                </div>

                <div class="card-header text-center">
                    <h3>Marketplace Listings</h3>
                    <div id="listingContainer" class="marketplace-list">
                    </div>
                    <script>
                        function addItem(){
                            const input = document.getElementById('itemName');
                            const itemName = input.value.trim();

                            if (itemName === "") {
                                alert("Please enter an item name!");
                                return;
                            }
                            const container = document.getElementById('listingContainer');
                            const newItem = document.createElement('div');
                            newItem.className = 'item-card';
                            newItem.innerHTML = `<strong>${itemName}</strong><br><small>Price: ${itemPrice}</small><br>
                            <button onclick="buyItem'('${itemName}', '${itemPrice}')">Buy</button>
                            `;
                            
                            container.appendChild(newItem);

                            nameinput.value = "";
                            priceinput.value = "";
                        }
                    </script>

                    <script>
                        function buyItem(name,price) {
                            alert(`Buying ${name} for ${price}`);
                        }
                    </script>
                </div>

            </div>



    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    
    <!-- Bootstrap JS -->
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
    
    <!-- Toastr JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    
    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.2.0/dist/ethers.umd.min.js"></script>
    
    <!-- app.js -->
    <script src="app.js"></script>

    <div id="overlay" style="
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(128, 128, 128, 0.97); /* semi-transparent grey */
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.5rem;
        color: white;
        user-select: none;
        ">
        Please connect your MetaMask wallet...
    </div>
</body>
</html>
